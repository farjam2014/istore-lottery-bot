name: VPS Read-only Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-readonly-diagnostics
  cancel-in-progress: true

jobs:
  diagnostics:
    if: github.ref == 'refs/heads/main' && github.actor == 'farjam2014'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Read-only host diagnostics
        shell: bash
        run: |
          set -u
          echo "=== Runner identity ==="
          id
          echo "=== Host ==="
          hostname
          uptime
          echo "=== Disk ==="
          df -h /
          echo "=== Memory ==="
          free -h
          echo "=== Runtime ==="
          node --version || true
          npm --version || true
          echo "=== Service states ==="
          printf 'istore-lottery-bot: '
          systemctl is-active istore-lottery-bot.service || true
          printf 'nginx: '
          systemctl is-active nginx.service || true
          echo "=== Diagnostics complete (no secrets or application logs collected) ==="
