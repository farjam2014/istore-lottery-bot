name: CI
on:
  push:
    branches: [rebuild/telegram-native-v1]
  pull_request:
    branches: [rebuild/telegram-native-v1]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node --check src/index.js
