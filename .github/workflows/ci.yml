name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# UX refactor branch validation: run syntax and regression checks after each navigation fix; latest receipt-resume recovery and draw-cancellation navigation update.
on:
  push:
    branches:
      - rebuild/telegram-native-v1
      - install/resumable-ubuntu-v2
      - fix/admin-role-session-command-routing
      - safety/migration-explicit-guard
      - audit/pr64-clean-rebuild
      - release/ustore-unified
      - audit/fix-release-blockers
      - audit/installer-preflight-stacked
      - 'remediation/**'
      - ux/unified-navigation-six-phase
  pull_request:
    branches:
      - rebuild/telegram-native-v1
      - install/resumable-ubuntu-v2
      - audit/pr64-clean-rebuild
      - release/ustore-unified
      - ux/production-base-ed490
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: istore_lottery_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      BOT_TOKEN: 12345678901234567890:test_token_for_ci_only
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: istore_lottery_ci
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_TEST_ADMIN_USER: root
      MYSQL_TEST_ADMIN_PASSWORD: root
      MYSQL_POOL_SIZE: 5
      BOT_ADMIN_IDS: 237573106
      RUN_MYSQL_TESTS: '1'
      ALLOW_DATABASE_MIGRATIONS: '1'
      ALLOW_TEST_DATABASE_MIGRATIONS: '1'
      DRAW_SEED_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: find src tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: node --check src/index.js
      - run: bash -n install.sh scripts/prepare-integration-db.sh scripts/run-integration-tests.sh
