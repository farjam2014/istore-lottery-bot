name: iStore VPS Operations

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose one approved VPS operation"
        required: true
        type: choice
        options:
          - status
          - health
          - dns-check

permissions:
  contents: read

concurrency:
  group: istore-vps-operations
  cancel-in-progress: false

jobs:
  operate:
    if: github.ref == 'refs/heads/main' && github.actor == 'farjam2014'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - name: Run approved operation
        env:
          REQUESTED_ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REQUESTED_ACTION" in
            status|health)
              sudo -n /usr/local/sbin/istore-admin "$REQUESTED_ACTION"
              ;;
            dns-check)
              echo "=== IPv4 DNS ==="
              getent ahostsv4 hi.ali-pardis.ir || true
              echo "=== IPv6 DNS ==="
              getent ahostsv6 hi.ali-pardis.ir || true
              echo "=== HTTPS RESPONSE ==="
              curl -sSI --max-time 8 https://hi.ali-pardis.ir/ || true
              ;;
            *)
              echo "Rejected operation"
              exit 2
              ;;
          esac
