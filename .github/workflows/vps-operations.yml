name: iStore VPS Operations

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose one approved VPS operation"
        required: true
        type: choice
        options:
          - status
          - bot-restart
          - bot-logs
          - nginx-status

permissions:
  contents: read

concurrency:
  group: istore-vps-operations
  cancel-in-progress: false

jobs:
  operate:
    if: github.ref == 'refs/heads/main' && github.actor == 'farjam2014'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - name: Run approved operation
        env:
          REQUESTED_ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REQUESTED_ACTION" in
            status|bot-restart|bot-logs|nginx-status) ;;
            *) echo "Rejected operation"; exit 2 ;;
          esac
          sudo -n /usr/local/sbin/istore-admin "$REQUESTED_ACTION"
