name: VPS Safe Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-safe-diagnostics
  cancel-in-progress: false

jobs:
  diagnostics:
    if: github.ref == 'refs/heads/main' && github.actor == 'farjam2014'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - name: Read-only VPS diagnostics
        shell: bash
        run: |
          set -u
          echo "=== UPTIME ==="
          uptime
          echo "=== MEMORY ==="
          free -h
          echo "=== DISK ==="
          df -h /
          echo "=== NODE ==="
          node --version 2>/dev/null || true
          npm --version 2>/dev/null || true
          echo "=== RUNNER SERVICE ==="
          systemctl list-units --type=service --state=running --no-legend 'actions.runner.*' 2>/dev/null || true
          echo "=== EXISTING APP PATHS ==="
          for p in /opt/ustore-telegram-bot /opt/ustore-releases/ed490912df9eacbd15e344f4ae00a785cda09646 /home/ghrunner/actions-runner; do
            if [ -e "$p" ]; then stat -c '%A %U:%G %n' "$p"; else echo "MISSING $p"; fi
          done
          echo "=== DATABASE / WEB SERVER BINARIES ==="
          for c in mysql mysqld nginx certbot; do command -v "$c" || true; done
          echo "=== LISTENING APP PORTS ==="
          ss -lnt 2>/dev/null | grep -E ':(80|443|3000|3306)\\b' || true
          echo "=== USTORE SERVICE ==="
          systemctl show ustore-telegram-bot.service -p ActiveState -p SubState -p User -p MainPID -p WorkingDirectory 2>/dev/null || true
          echo "=== LOCAL HEALTH CHECK ==="
          curl --silent --show-error --max-time 3 http://127.0.0.1:3000/health || true
