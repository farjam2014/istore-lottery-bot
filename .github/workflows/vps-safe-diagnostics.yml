name: VPS Safe Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-safe-diagnostics
  cancel-in-progress: false

jobs:
  diagnostics:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - name: Read-only VPS diagnostics
        shell: bash
        run: |
          set -u
          echo "=== HOST ==="
          hostname
          id
          echo "=== UPTIME ==="
          uptime
          echo "=== MEMORY ==="
          free -h
          echo "=== DISK ==="
          df -h /
          echo "=== NODE ==="
          node --version 2>/dev/null || true
          npm --version 2>/dev/null || true
          echo "=== RUNNER SERVICE ==="
          systemctl list-units --type=service --state=running --no-legend 'actions.runner.*' 2>/dev/null || true
          echo "=== SUDO POLICY (NON-INTERACTIVE, READ-ONLY QUERY) ==="
          sudo -n -l 2>&1 || true
          echo "=== SERVICE ACCOUNT GROUPS ==="
          getent group sudo || true
          echo "=== EXISTING APP PATHS ==="
          for p in /opt/istore-lottery-bot /root/istore-lottery-bot /root/istore-staging /home/ghrunner/actions-runner; do
            if [ -e "$p" ]; then stat -c '%A %U:%G %n' "$p"; else echo "MISSING $p"; fi
          done
          echo "=== DATABASE / WEB SERVER BINARIES ==="
          for c in mysql mysqld nginx certbot; do command -v "$c" || true; done
          echo "=== LISTENING APP PORTS ==="
          ss -lnt 2>/dev/null | grep -E ':(80|443|3000|3306)\\b' || true
          echo "=== LOTTERY SERVICE ==="
          systemctl is-active istore-lottery-bot 2>/dev/null || true
          echo "=== LOCAL HEALTH CHECK ==="
          curl --silent --show-error --max-time 3 http://127.0.0.1:3000/health || true
