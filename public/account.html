<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب کاربری USTORE</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f3f5f9;color:#172033;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:460px;margin:5vh auto;background:#fff;border:1px solid #e5e9f0;border-radius:22px;padding:26px;box-shadow:0 14px 45px #1a2b4810}h1{font-size:23px;margin:0 0 8px}.muted{color:#667085;font-size:14px;line-height:1.9}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button,.action{border:0;border-radius:12px;padding:12px 15px;background:#172033;color:white;font:inherit;cursor:pointer}.tabs button{flex:1;background:#edf0f5;color:#344054}.tabs button.active{background:#172033;color:white}label{display:block;font-size:14px;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:11px;font:inherit;direction:ltr;text-align:left}form .action{width:100%;margin-top:18px}.panel{display:none}.panel.active{display:block}.notice{margin-top:15px;padding:12px;border-radius:11px;background:#f2f4f7;white-space:pre-wrap;font-size:14px;line-height:1.8}.notice.error{background:#fff1f0;color:#b42318}.notice.ok{background:#ecfdf3;color:#027a48}.link{display:inline-block;margin-top:14px;color:#175cd3}small{color:#667085}
</style></head>
<body><main class="wrap"><h1>حساب کاربری USTORE</h1><p class="muted">با شماره موبایل و رمز عبور وارد شوید. برای ثبت‌نام یا بازیابی رمز، ابتدا ربات تلگرام را با همان حسابی که در قرعه‌کشی ثبت کرده‌اید Start کنید.</p>
<p><a class="link" href="https://t.me/istorelotterybot" target="_blank" rel="noopener">باز کردن ربات تلگرام USTORE</a></p>
<div class="tabs"><button id="tab-login" class="active" type="button">ورود</button><button id="tab-register" type="button">ثبت‌نام</button><button id="tab-forgot" type="button">فراموشی رمز</button></div>
<section id="login" class="panel active"><form id="login-form"><label>شماره موبایل</label><input name="phone" inputmode="tel" autocomplete="tel" placeholder="09123456789" required><label>رمز عبور</label><input name="password" type="password" autocomplete="current-password" required><button class="action">ورود به حساب</button></form></section>
<section id="register" class="panel"><form id="register-form"><label>شماره موبایل ثبت‌شده در پروفایل لاتاری</label><input name="phone" inputmode="tel" autocomplete="tel" placeholder="09123456789" required><label>رمز عبور جدید (حداقل ۱۰ کاراکتر)</label><input name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required><button class="action">ساخت حساب کاربری</button></form></section>
<section id="forgot" class="panel"><form id="forgot-form"><label>شماره موبایل حساب</label><input name="phone" inputmode="tel" autocomplete="tel" placeholder="09123456789" required><button class="action">ارسال درخواست به تلگرام</button></form></section>
<section id="reset" class="panel"><form id="reset-form"><label>رمز عبور جدید</label><input name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required><button class="action">ثبت رمز جدید</button></form></section>
<div id="notice" class="notice" hidden></div></main>
<script>
const $=s=>document.querySelector(s), token=new URLSearchParams(location.search).get('token');
function show(name){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$('#'+name).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.id==='tab-'+name));}
function note(message,type='ok'){const n=$('#notice');n.hidden=false;n.className='notice '+type;n.textContent=message;}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(data)});const j=await r.json().catch(()=>({error:'پاسخ سرور قابل خواندن نیست.'}));if(!r.ok)throw new Error(j.error||'درخواست ناموفق بود.');return j;}
$('#tab-login').onclick=()=>show('login');$('#tab-register').onclick=()=>show('register');$('#tab-forgot').onclick=()=>show('forgot');
$('#login-form').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);await post('/api/account/login',{phone:f.get('phone'),password:f.get('password')});note('ورود با موفقیت انجام شد.');}catch(x){note(x.message,'error');}};
$('#register-form').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);await post('/api/account/register',{phone:f.get('phone'),password:f.get('password')});note('حساب شما ساخته شد و به تلگرام متصل است.');}catch(x){note(x.message,'error');}};
$('#forgot-form').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);const j=await post('/api/account/forgot',{phone:f.get('phone')});note(j.message);}catch(x){note(x.message,'error');}};
$('#reset-form').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);const j=await post('/api/account/reset',{token,password:f.get('password')});note(j.message);history.replaceState({},'',location.pathname);show('login');}catch(x){note(x.message,'error');}};
if(token){show('reset');fetch('/api/account/reset/validate?token='+encodeURIComponent(token)).then(r=>{if(!r.ok)throw new Error('لینک بازیابی نامعتبر یا منقضی است.');}).catch(e=>note(e.message,'error'));}
</script></body></html>
